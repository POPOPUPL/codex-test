<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Recorder Pro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar glass-card">
        <div>
          <p class="eyebrow">NEW STYLE</p>
          <h1>Desktop Recorder Pro</h1>
          <p class="subtitle">Fast recording with system audio, microphone, floating avatar, and full whiteboard mode.</p>
        </div>
        <div class="status-pill">Ready to capture</div>
      </section>

      <section class="layout-grid">
        <aside class="control-panel glass-card">
          <h2>Recording Controls</h2>

          <div class="field">
            <label for="resolution">Output Size</label>
            <select id="resolution">
              <option value="1">100% Original</option>
              <option value="0.75">75%</option>
              <option value="0.5">50%</option>
            </select>
          </div>

          <div class="field check-grid">
            <label class="toggle"><input id="sysAudio" type="checkbox" checked />System audio</label>
            <label class="toggle"><input id="micAudio" type="checkbox" checked />Microphone</label>
            <label class="toggle"><input id="whiteboardToggle" type="checkbox" />Whiteboard mode</label>
          </div>

          <div class="field inline">
            <label for="avatarShape">Avatar Shape</label>
            <select id="avatarShape">
              <option value="circle">Circle</option>
              <option value="ellipse">Ellipse</option>
            </select>
          </div>

          <div class="field">
            <label for="avatarSize">Avatar Size</label>
            <input id="avatarSize" type="range" min="80" max="280" value="160" />
          </div>

          <div class="actions">
            <button id="startBtn">Start Recording</button>
            <button id="stopBtn" disabled>Stop</button>
            <a id="downloadLink" class="hidden" download="recording.webm">Download Video</a>
          </div>

          <p class="tip">Tip: In browser share dialog, enable system audio to include desktop playback.</p>
        </aside>

        <section class="preview-panel glass-card">
          <h2>Live Preview</h2>
          <div id="stage" class="stage" title="Drag avatar to reposition">
            <video id="screenVideo" autoplay muted playsinline></video>
            <div id="avatarBox" class="avatar circle" style="left: 24px; top: 24px; width: 160px; height: 160px;">
              <video id="avatarVideo" autoplay muted playsinline></video>
            </div>
            <canvas id="whiteboard" class="hidden"></canvas>
          </div>
        </section>
      </section>

      <section class="whiteboard-tools glass-card hidden" id="whiteboardTools">
        <h3>Whiteboard Tools</h3>
        <label>Pen Color <input id="penColor" type="color" value="#e84a5f" /></label>
        <label>Pen Width <input id="penWidth" type="range" min="1" max="16" value="4" /></label>
        <button id="clearBoard">Clear Whiteboard</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
